<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Orçamento — OrçaZAP Pro</title><link rel="stylesheet" href="/css/portal.css"></head><body><main class="public-quote"><div id="quote-status" class="message"></div><section id="quote-card" class="card">Carregando orçamento...</section><section id="decision-card" class="card hidden"><h2>Decisão do cliente</h2><p class="muted">Você pode aprovar ou recusar este orçamento.</p><div class="actions"><button id="approve" class="primary">Aprovar orçamento</button><button id="reject" class="danger">Recusar orçamento</button></div><textarea id="reject-reason" class="hidden" placeholder="Motivo da recusa (opcional)"></textarea><button id="confirm-reject" class="danger hidden">Confirmar recusa</button></section><section id="signature-card" class="card hidden"><h2>Assinatura</h2><p class="muted">Desenhe sua assinatura no quadro abaixo.</p><canvas id="signature" width="900" height="260"></canvas><label>Nome completo<input id="signer-name" required></label><label class="check"><input id="accept-terms" type="checkbox"> Confirmo que li e concordo com este orçamento.</label><button id="sign" class="primary">Enviar assinatura</button></section></main><script type="module" src="/js/public-quote.js"></script></body></html>
