<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Administração — OrçaZAP Pro</title><link rel="stylesheet" href="/css/portal.css"></head><body><main class="admin"><header class="top"><div><h1>Painel administrativo</h1><p class="muted">Criar e administrar empresas.</p></div><button id="logout" class="secondary">Sair</button></header><section class="grid"><div class="card"><h2>Nova empresa</h2><form id="company-form"><label>Nome da empresa<input id="company-name" required></label><label>Nome do responsável<input id="owner-name" required></label><label>E-mail de login<input id="owner-email" type="email" required></label><label>Senha inicial<input id="owner-password" type="password" minlength="8" required></label><label>Telefone<input id="company-phone"></label><button class="primary">Criar empresa</button><p id="admin-message" class="message"></p></form></div><div class="card"><h2>Empresas cadastradas</h2><div id="companies-list">Carregando...</div></div></section></main><script type="module" src="/js/admin.js"></script></body></html>
